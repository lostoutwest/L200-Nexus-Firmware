[env:l200-nexus-c6]
platform = espressif32
board = esp32-c6-devkitm-1
framework = arduino
monitor_speed = 115200
upload_protocol = esptool
lib_deps =
    fastled/FastLED @ ^3.6.0
    h2zero/NimBLE-Arduino @ 2.5.1
    bblanchon/ArduinoJson @ ^7.0.4

; The L200 controller is moving to an ESP32-C6-MINI-1-class board.
; esp32-c6-devkitm-1 is used as the portable PlatformIO compatibility target.
